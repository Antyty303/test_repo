name: Verilator CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verilator-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Install Verilator and compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator g++ cmake make

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build All Tests
      run: cmake --build build -j $(nproc)

    - name: Run Tests
      run: |
        ./build/test_adder_4bit
        ./build/test_sub_4bit
        ./build/test_seq
