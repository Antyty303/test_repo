name: Verilator CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verilator-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Verilator and compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator g++ make

    - name: Build and Run Adder 4-bit Test
      run: |
        verilator --cc --exe --build -j -Wno-WIDTH --trace tb/test_adder_4bit.cpp src/arithmetic_blocks.sv --top-module adder_4bit
        ./obj_dir/Vadder_4bit

    - name: Build and Run Subtractor 4-bit Test
      run: |
        verilator --cc --exe --build -j -Wno-WIDTH --trace tb/test_subtractor_4bit.cpp src/arithmetic_blocks.sv --top-module sub_4bit
        ./obj_dir/Vsub_4bit
